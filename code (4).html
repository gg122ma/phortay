<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>三脚猫 3 Leg Cat Cafe</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐱</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Source+Sans+3:wght@300;400;600;700&family=DM+Mono:wght@400&display=swap" rel="stylesheet">

<style>
/* RESET & VARIABLES */
:root{
  --bg:#f5f0ea;--bg-card:#faf7f2;--bg-el:#fff;
  --text:#2a1f14;--text-muted:#8a7b6b;
  --primary:#c45a3c;--primary-hover:#a84830;
  --secondary:#2d5a3d;--accent:#d4943a;
  --border:#e5ddd4;--ring:rgba(196,90,60,.3);
  --destructive:#c45a3c;
  --shadow-sm:0 1px 2px rgba(42,31,20,.06);
  --shadow-md:0 4px 12px rgba(42,31,20,.08);
  --shadow-lg:0 12px 32px rgba(42,31,20,.12);
  --fd:'Playfair Display',Georgia,serif;
  --fb:'Source Sans 3',-apple-system,sans-serif;
  --fm:'DM Mono',monospace;
  --r:.5rem;--rl:1rem;--rf:9999px;--tr:.25s ease;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--fb);background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}img{max-width:100%;display:block}
button,input,textarea,select{font:inherit;color:inherit;border:none;background:none;outline:none}button{cursor:pointer}
h1,h2,h3,h4{font-family:var(--fd);font-weight:700;line-height:1.2}
h1{font-size:clamp(2rem,5vw,3.5rem)}h2{font-size:clamp(1.5rem,3.5vw,2.5rem)}
.tc{color:var(--text-muted)}.tp{color:var(--primary)}.td{color:var(--destructive)}
.mt1{margin-top:.5rem}.mt2{margin-top:1rem}.mt3{margin-top:1.5rem}.mt4{margin-top:2rem}
.mb1{margin-bottom:.5rem}.mb2{margin-bottom:1rem}.mb3{margin-bottom:1.5rem}
.fl{display:flex}.aic{align-items:center}.jcb{justify-content:space-between}.jcc{justify-content:center}
.tc-t{text-align:center}.hd{display:none!important}

/* LAYOUT */
.ctn{max-width:1200px;margin:0 auto;padding:0 1.5rem}
.sec{padding:5rem 0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:2rem}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:2rem}
@media(max-width:768px){.g2,.g3{grid-template-columns:1fr}}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;font-weight:600;font-size:.875rem;padding:.625rem 1.25rem;border-radius:var(--r);transition:var(--tr);white-space:nowrap}
.btn:hover{opacity:.9;transform:translateY(-1px)}
.btn-p{background:var(--primary);color:#fff}.btn-p:hover{background:var(--primary-hover)}
.btn-s{background:var(--secondary);color:#fff}
.btn-o{border:1.5px solid var(--border);background:transparent}.btn-o:hover{border-color:var(--primary);color:var(--primary)}
.btn-g{background:transparent}.btn-g:hover{background:rgba(0,0,0,.05)}
.btn-sm{padding:.375rem .875rem;font-size:.8125rem}
.btn-lg{padding:.875rem 2rem;font-size:1.125rem}
.btn-fw{width:100%}
.btn-ic{width:2.25rem;height:2.25rem;padding:0;border-radius:var(--rf);display:flex;align-items:center;justify-content:center;overflow:hidden}
.btn-u{background:var(--primary);color:#fff;border-radius:var(--rf)}
.btn-u:hover{background:var(--primary-hover)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-d{background:var(--destructive);color:#fff}

/* NAVBAR */
.navbar{position:sticky;top:0;z-index:1000;background:rgba(245,240,234,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.navbar-i{display:flex;align-items:center;justify-content:space-between;height:4rem;gap:2rem}
.nav-logo{display:flex;flex-direction:column;line-height:1.1}
.logo-z{font-family:var(--fd);font-size:1.25rem;font-weight:700;color:var(--primary)}
.logo-e{font-size:.625rem;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--text-muted)}
.nav-links{display:flex;gap:2rem}
.nav-l{font-size:.875rem;font-weight:500;color:var(--text-muted);transition:var(--tr);position:relative}
.nav-l:hover,.nav-l.active{color:var(--primary)}
.nav-l.active::after{content:'';position:absolute;bottom:-.25rem;left:0;right:0;height:2px;background:var(--primary);border-radius:1px}
.nav-acts{display:flex;align-items:center;gap:.75rem}
.hamburger{display:none;width:2.5rem;height:2.5rem;align-items:center;justify-content:center;border-radius:var(--r)}
.hamburger:hover{background:rgba(0,0,0,.05)}
@media(max-width:768px){.nav-links,.nav-acts{display:none}.hamburger{display:flex}}

/* MOBILE */
.m-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:1100;opacity:0;pointer-events:none;transition:opacity .3s}
.m-overlay.open{opacity:1;pointer-events:auto}
.m-panel{position:fixed;top:0;right:0;bottom:0;width:300px;z-index:1200;background:var(--bg-el);transform:translateX(100%);transition:transform .3s ease;display:flex;flex-direction:column;padding:1.5rem}
.m-panel.open{transform:translateX(0)}
.m-hdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:2rem}
.m-close{width:2.5rem;height:2.5rem;display:flex;align-items:center;justify-content:center;border-radius:var(--r)}
.m-links{flex:1;display:flex;flex-direction:column;gap:.25rem}
.m-link{font-size:1.125rem;font-weight:500;padding:.75rem 1rem;border-radius:var(--r);transition:var(--tr)}
.m-link:hover,.m-link.active{background:var(--primary);color:#fff}
.m-foot{border-top:1px solid var(--border);padding-top:1.5rem;display:flex;flex-direction:column;gap:1rem}
.m-lang{display:flex;gap:.5rem;margin-top:.5rem}
.lang-chip{padding:.375rem .75rem;border-radius:var(--rf);border:1px solid var(--border);font-size:.8125rem;font-weight:500;transition:var(--tr)}
.lang-chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}

/* DROPDOWN */
.dd{position:relative}
.dd-menu{position:absolute;top:calc(100% + .5rem);right:0;min-width:160px;background:var(--bg-el);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow-md);opacity:0;pointer-events:none;transform:translateY(-4px);transition:var(--tr);z-index:100;padding:.25rem}
.dd.open .dd-menu{opacity:1;pointer-events:auto;transform:translateY(0)}
.dd-item{display:block;padding:.5rem .75rem;font-size:.875rem;border-radius:calc(var(--r) - 2px);transition:var(--tr);white-space:nowrap}
.dd-item:hover{background:rgba(0,0,0,.05)}
.dd-item.sel{color:var(--primary);font-weight:600}
.dd-hdr{padding:.5rem .75rem;font-size:.8125rem;color:var(--text-muted);border-bottom:1px solid var(--border);margin-bottom:.25rem}

/* HERO */
.hero{position:relative;min-height:80vh;display:flex;align-items:center;justify-content:center;overflow:hidden;background:linear-gradient(135deg,#3a2010,#1a0e06 40%,#2d1810)}
.hero-bg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.35}
.hero-ov{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.3),rgba(0,0,0,.55))}
.hero-ct{position:relative;z-index:1;text-align:center;color:#fff;max-width:48rem;padding:2rem}
.hero-title{font-size:clamp(2.5rem,7vw,5rem);font-weight:700;margin-bottom:.5rem;text-shadow:0 2px 20px rgba(0,0,0,.3)}
.hero-sub{font-size:clamp(1rem,2.5vw,1.375rem);opacity:.9;margin-bottom:2.5rem;font-weight:400;max-width:36rem;margin-left:auto;margin-right:auto}
.hero-btns{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap}
.hero-btns .btn-p{background:var(--accent);color:var(--text);font-weight:700}
.hero-btns .btn-p:hover{background:#e0a84e}
.hero-btns .btn-o{border-color:rgba(255,255,255,.6);color:#fff}
.hero-btns .btn-o:hover{background:rgba(255,255,255,.15);border-color:#fff}

/* CARDS */
.card{background:var(--bg-el);border:1px solid var(--border);border-radius:var(--rl);overflow:hidden;box-shadow:var(--shadow-sm);transition:var(--tr)}
.card:hover{box-shadow:var(--shadow-md);transform:translateY(-3px)}
.card-img{aspect-ratio:4/3;overflow:hidden;background:var(--bg-card)}
.card-img img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.card:hover .card-img img{transform:scale(1.05)}
.card-body{padding:1.5rem}
.card-title{font-size:1.125rem;font-weight:700;margin-bottom:.25rem}
.card-price{font-family:var(--fm);color:var(--primary);font-weight:700}
.card-desc{color:var(--text-muted);font-size:.875rem;line-height:1.5}

/* MENU ITEM */
.mi{display:flex;gap:1.25rem;padding:1.25rem;background:var(--bg-el);border:1px solid var(--border);border-radius:var(--rl);transition:var(--tr)}
.mi:hover{border-color:var(--primary);box-shadow:var(--shadow-sm)}
.mi-img{width:120px;height:120px;border-radius:var(--r);overflow:hidden;flex-shrink:0;background:var(--bg-card);display:flex;align-items:center;justify-content:center}
.mi-img img{width:100%;height:100%;object-fit:cover}
.mi-body{flex:1;display:flex;flex-direction:column;justify-content:center}
.mi-hdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:.25rem;gap:1rem}
@media(max-width:640px){.mi{flex-direction:column}.mi-img{width:100%;height:200px}}

/* SECTION HEADER */
.sh{text-align:center;margin-bottom:3rem}
.sh h2,.sh h1{color:var(--primary);margin-bottom:.75rem}
.sd{width:4rem;height:3px;background:var(--accent);border-radius:2px;margin:0 auto}

/* TABS */
.tabs{display:flex;justify-content:center;flex-wrap:wrap;gap:.5rem;margin-bottom:2.5rem}
.tab{padding:.5rem 1.5rem;border-radius:var(--rf);font-size:.875rem;font-weight:500;border:1.5px solid var(--border);transition:var(--tr);background:transparent}
.tab:hover{border-color:var(--primary);color:var(--primary)}
.tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}

/* FORMS */
.fg{margin-bottom:1.25rem}
.fl-l{display:block;font-size:.875rem;font-weight:600;margin-bottom:.375rem}
.fi,.fsel,.ft{width:100%;padding:.625rem .875rem;border:1.5px solid var(--border);border-radius:var(--r);background:var(--bg-el);font-size:.9375rem;transition:var(--tr)}
.fi:focus,.fsel:focus,.ft:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--ring)}
.ft{min-height:80px;resize:vertical}
.ferr{color:var(--destructive);font-size:.8125rem;margin-top:.5rem}
.fgr{display:grid;grid-template-columns:1fr 1fr;gap:1.25rem}
@media(max-width:640px){.fgr{grid-template-columns:1fr}}
.fcard{background:var(--bg-el);border:1px solid var(--border);border-radius:var(--rl);box-shadow:var(--shadow-md);padding:2rem;max-width:40rem;margin:0 auto}
.fok{text-align:center;padding:3rem 1rem}
.fok-ic{width:5rem;height:5rem;border-radius:50%;background:#dcfce7;color:#16a34a;display:flex;align-items:center;justify-content:center;margin:0 auto 1.5rem;font-size:2rem}
.fsel{appearance:auto}

/* TABLES */
.tw{overflow-x:auto}
.dt{width:100%;border-collapse:collapse;font-size:.875rem}
.dt th{text-align:left;padding:.75rem 1rem;font-weight:600;font-size:.8125rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;border-bottom:2px solid var(--border);white-space:nowrap}
.dt td{padding:.75rem 1rem;border-bottom:1px solid var(--border);vertical-align:middle}
.dt tr:hover td{background:rgba(0,0,0,.02)}
.thumb{width:48px;height:48px;border-radius:.375rem;object-fit:cover}

/* BADGE */
.badge{display:inline-block;padding:.125rem .625rem;border-radius:var(--rf);font-size:.75rem;font-weight:600}
.b-pending{background:#fef3c7;color:#92400e}
.b-confirmed{background:#dcfce7;color:#166534}
.b-cancelled{background:#fee2e2;color:#991b1b}

/* MODAL */
.modal{position:fixed;inset:0;z-index:2000;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.modal.open{opacity:1;pointer-events:auto}
.modal-ov{position:absolute;inset:0;background:rgba(0,0,0,.5)}
.modal-ct{position:relative;background:var(--bg-el);border-radius:var(--rl);box-shadow:var(--shadow-lg);max-width:640px;width:95%;max-height:85vh;overflow-y:auto;padding:2rem}
.modal-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem}
.modal-hd h2{font-size:1.25rem}
.modal-x{width:2rem;height:2rem;display:flex;align-items:center;justify-content:center;border-radius:var(--r);font-size:1.25rem}
.modal-x:hover{background:rgba(0,0,0,.05)}

/* ADMIN */
.a-layout{display:flex;min-height:calc(100vh - 4rem)}
.a-side{width:220px;background:var(--bg-el);border-right:1px solid var(--border);padding:1.5rem 1rem;flex-shrink:0;display:flex;flex-direction:column;gap:.25rem}
.a-sb{display:flex;align-items:center;gap:.75rem;padding:.625rem .875rem;border-radius:var(--r);font-size:.875rem;font-weight:500;color:var(--text-muted);transition:var(--tr);text-align:left;width:100%}
.a-sb:hover{background:rgba(0,0,0,.04);color:var(--text)}
.a-sb.active{background:var(--primary);color:#fff}
.a-main{flex:1;padding:2rem;overflow-x:auto}
.a-sec{display:none}.a-sec.active{display:block}
.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1.25rem;margin-bottom:2rem}
.sc{background:var(--bg-el);border:1px solid var(--border);border-radius:var(--rl);padding:1.5rem}
.sc-label{font-size:.8125rem;color:var(--text-muted);margin-bottom:.25rem}
.sc-val{font-family:var(--fd);font-size:2rem;font-weight:700;color:var(--primary)}
.ap{background:var(--bg-el);border:1px solid var(--border);border-radius:var(--rl);padding:1.5rem;margin-bottom:2rem}
.ap-title{font-size:1.125rem;font-weight:700;margin-bottom:1.25rem;display:flex;justify-content:space-between;align-items:center}
.fg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:.75rem}
.fg-item{display:flex;align-items:center;gap:.75rem;padding:.75rem;border:1.5px solid var(--border);border-radius:var(--r);cursor:pointer;transition:var(--tr)}
.fg-item:hover{border-color:var(--primary)}
.fg-item.sel{border-color:var(--primary);background:rgba(196,90,60,.08)}
.fg-item input[type=checkbox]{accent-color:var(--primary);width:1.125rem;height:1.125rem}
.img-prev{max-width:200px;max-height:140px;border-radius:var(--r);margin-top:.75rem}
@media(max-width:768px){.a-layout{flex-direction:column}.a-side{width:100%;flex-direction:row;overflow-x:auto;padding:.75rem;border-right:none;border-bottom:1px solid var(--border)}.a-sb{white-space:nowrap;font-size:.8125rem;padding:.5rem .75rem}.a-main{padding:1rem}}

/* TOAST */
#toast-box{position:fixed;top:1rem;right:1rem;z-index:9999;display:flex;flex-direction:column;gap:.5rem}
.toast{padding:.75rem 1.25rem;border-radius:var(--r);color:#fff;font-size:.875rem;font-weight:500;box-shadow:var(--shadow-md);animation:tin .3s ease,tout .3s ease 3s forwards;max-width:340px}
.toast-ok{background:var(--secondary)}.toast-err{background:var(--destructive)}
@keyframes tin{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes tout{to{opacity:0;transform:translateX(100%)}}

/* FOOTER */
.footer{border-top:1px solid var(--border);background:var(--bg-card);padding:4rem 0 2rem}
.f-grid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:3rem}
@media(max-width:768px){.f-grid{grid-template-columns:1fr;gap:2rem}}
.f-desc{color:var(--text-muted);font-size:.875rem;margin-top:1rem;max-width:20rem;line-height:1.6}
.f-heading{font-size:.8125rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:1rem;font-family:var(--fb)}
.f-link{display:block;color:var(--text-muted);font-size:.875rem;padding:.25rem 0;transition:var(--tr)}
.f-link:hover{color:var(--primary)}
.f-text{color:var(--text-muted);font-size:.875rem;line-height:1.6}
.f-bot{border-top:1px solid var(--border);margin-top:3rem;padding-top:1.5rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1rem;font-size:.8125rem;color:var(--text-muted)}
.f-social{display:flex;gap:1.25rem}
.f-social a:hover{color:var(--primary)}

/* ANIMATION */
.fiu{animation:fiu .6s ease both}
@keyframes fiu{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.skel{background:linear-gradient(90deg,var(--border) 25%,rgba(0,0,0,.04) 50%,var(--border) 75%);background-size:200% 100%;animation:shm 1.5s infinite;border-radius:var(--r)}
@keyframes shm{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* page container */
.page{display:none}.page.active{display:block}

/* ===== NEW: Avatar styles ===== */
.avatar-nav{width:2.25rem;height:2.25rem;border-radius:50%;object-fit:cover;display:block}
.avatar-lg{width:6rem;height:6rem;border-radius:50%;object-fit:cover;border:3px solid var(--border);background:var(--bg-card)}
</style>
</head>
<body>

<!-- NAVBAR -->
<div id="navbar"></div>

<!-- PAGES -->

<!-- HOME -->
<div class="page" id="pg-home">
  <section class="hero" id="hero-sec">
    <div class="hero-ov"></div>
    <div class="hero-ct fiu">
      <h1 class="hero-title" id="h-title">3 Leg Cat</h1>
      <p class="hero-sub" id="h-sub">Loading...</p>
      <div class="hero-btns">
        <a class="btn btn-p btn-lg" id="h-book" href="#/reservation"></a>
        <a class="btn btn-o btn-lg" id="h-menu" href="#/menu"></a>
      </div>
    </div>
  </section>
  <section class="sec" id="feat-sec">
    <div class="ctn">
      <div class="sh"><h2 id="feat-title"></h2><div class="sd"></div></div>
      <div class="g3" id="feat-grid"></div>
      <div class="tc-t mt4"><a href="#/menu" class="btn btn-o" id="feat-more"></a></div>
    </div>
  </section>
</div>

<!-- MENU -->
<div class="page" id="pg-menu">
  <section class="sec">
    <div class="ctn">
      <div class="sh"><h1 id="m-title"></h1><div class="sd"></div></div>
      <div class="tabs" id="m-tabs"></div>
      <div class="g2" id="m-grid"></div>
    </div>
  </section>
</div>

<!-- RESERVATION -->
<div class="page" id="pg-reservation">
  <section class="sec" style="background:var(--bg-card)">
    <div class="ctn">
      <div class="fcard" id="res-form-wrap">
        <div class="tc-t mb3"><h1 id="r-title"></h1><div class="sd mt2"></div></div>
        <form id="r-form">
          <div class="fgr">
            <div class="fg"><label class="fl-l" id="rl-name"></label><input type="text" id="r-name" class="fi" required></div>
            <div class="fg"><label class="fl-l" id="rl-email"></label><input type="email" id="r-email" class="fi" required></div>
          </div>
          <div class="fgr">
            <div class="fg"><label class="fl-l" id="rl-phone"></label><input type="tel" id="r-phone" class="fi" required></div>
            <div class="fg"><label class="fl-l" id="rl-size"></label><input type="number" id="r-size" class="fi" min="1" max="20" value="2" required></div>
          </div>
          <div class="fgr">
            <div class="fg"><label class="fl-l" id="rl-date"></label><input type="date" id="r-date" class="fi" required></div>
            <div class="fg"><label class="fl-l" id="rl-time"></label><input type="time" id="r-time" class="fi" value="19:00" required></div>
          </div>
          <div class="fg"><label class="fl-l" id="rl-notes"></label><textarea id="r-notes" class="ft" rows="3"></textarea></div>
          <button type="submit" class="btn btn-p btn-fw btn-lg" id="r-btn"></button>
        </form>
      </div>
      <div class="fcard hd" id="res-ok">
        <div class="fok">
          <div class="fok-ic">✓</div>
          <h2 id="ok-title"></h2>
          <p class="tc mt1 mb3" id="ok-desc"></p>
          <button class="btn btn-o" id="ok-another" onclick="resetRes()"></button>
        </div>
      </div>
    </div>
  </section>
</div>

<!-- ABOUT -->
<div class="page" id="pg-about">
  <section class="sec">
    <div class="ctn" style="max-width:720px">
      <div class="sh"><h1 id="ab-title"></h1><div class="sd"></div></div>
      <p id="ab-story" style="font-size:1.125rem;line-height:1.8;color:var(--text-muted)"></p>
    </div>
  </section>
</div>

<!-- CONTACT -->
<div class="page" id="pg-contact">
  <section class="sec">
    <div class="ctn" style="max-width:720px">
      <div class="sh"><h1 id="co-title"></h1><div class="sd"></div></div>

/* ===== AUTH ===== */
var curUser=null;

async function signIn(e,p){
  if(!sb)throw new Error('Supabase not configured');
  var r=await sb.auth.signInWithPassword({email:e,password:p});
  if(r.error)throw r.error;
  var pf=await getProf(r.data.user.id);
  return{user:r.data.user,profile:pf}
}

/* ===== NEW: signUp ===== */
async function signUp(name,email,password){
  if(!sb)throw new Error('Supabase not configured');
  var r=await sb.auth.signUp({email:email,password:password});
  if(r.error)throw r.error;
  if(r.data.user){
    /* upsert profile row so the name is stored immediately */
    await sb.from('profiles').upsert({id:r.data.user.id,name:name,email:email});
  }
  return r.data;
}

async function signOut(){if(sb)await sb.auth.signOut()}
async function getProf(uid){if(!sb)return null;var r=await sb.from('profiles').select('*').eq('id',uid).single();return r.data}
async function getCur(){if(!sb)return null;var s=await sb.auth.getSession();if(!s.data||!s.data.session)return null;return await getProf(s.data.session.user.id)}

/* ===== CLOUDINARY ===== */
async function uploadImg(file){
  var fd=new FormData();fd.append('file',file);fd.append('upload_preset',CFG.CLD_PRESET);
  var r=await fetch('https://api.cloudinary.com/v1_1/'+CFG.CLD_CLOUD+'/image/upload',{method:'POST',body:fd});
  var d=await r.json();
  if(d.secure_url)return d.secure_url;
  throw new Error((d.error&&d.error.message)||'Upload failed')
}

  if(h==='profile'&&!curUser){location.hash='#/login';return}

async function loadHome(){
  if(!sb)return;
  try{
    var s=await sb.from('site_settings').select('value').eq('key','hero').single();
    homeD.hero=s.data?s.data.value:{};
    var f=await sb.from('site_settings').select('value').eq('key','featured_ids').single();
    var ids=(f.data&&f.data.value&&f.data.value.ids)||[];
    if(ids.length>0){var it=await sb.from('menu_items').select('*').in('id',ids).eq('is_available',true);homeD.featured=it.data||[]}
    else{var it2=await sb.from('menu_items').select('*').eq('is_available',true).order('sort_order').limit(3);homeD.featured=it2.data||[]}
  }catch(e){}
}
function renderHome(){
  var h=homeD.hero;
  var sec=document.getElementById('hero-sec');
  var eb=sec.querySelector('.hero-bg');if(eb)eb.remove();
  if(h.image_url){var bd=document.createElement('div');bd.className='hero-bg';bd.style.backgroundImage='url('+h.image_url+')';sec.insertBefore(bd,sec.firstChild)}
  document.getElementById('h-title').textContent=lf(h,'title')||'3 Leg Cat';
  document.getElementById('h-sub').textContent=lf(h,'subtitle')||'';
  document.getElementById('h-book').textContent=t('home.bookNow');
  document.getElementById('h-menu').textContent=t('home.viewMenu');
  document.getElementById('feat-title').textContent=t('home.featured');
  document.getElementById('feat-more').textContent=t('home.viewMenu');
  var g=document.getElementById('feat-grid');
  if(!homeD.featured.length){g.innerHTML='<p class="tc tc-t" style="grid-column:1/-1">Menu items coming soon.</p>';return}
  g.innerHTML=homeD.featured.map(function(it,i){
    var img=it.image_url?'<div class="card-img"><img src="'+it.image_url+'" alt="'+eh(lf(it,'name'))+'"></div>':'<div class="card-img" style="display:flex;align-items:center;justify-content:center"><span style="font-size:3rem">☕</span></div>';
    return '<div class="card fiu" style="animation-delay:'+(i*.15)+'s">'+img+'<div class="card-body"><div class="fl jcb aic mb1"><h3 class="card-title">'+eh(lf(it,'name'))+'</h3><span class="card-price">'+t('menu.price')+' '+Number(it.price).toFixed(2)+'</span></div><p class="card-desc">'+eh(lf(it,'desc'))+'</p></div></div>'}).join('');
}

/* ===== MENU ===== */
var menuD={cats:[],items:[]};
var menuCat='all';
async function loadMenu(){
  if(!sb)return;
  try{
    var c=await sb.from('categories').select('*').order('sort_order');menuD.cats=c.data||[];
    var i=await sb.from('menu_items').select('*').eq('is_available',true).order('sort_order');menuD.items=i.data||[];
  }catch(e){}
}
function renderMenu(){
  document.getElementById('m-title').textContent=t('menu.title');
  var th='<button class="tab'+(menuCat==='all'?' active':'')+'" data-cat="all">'+t('menu.all')+'</button>';
  th+=menuD.cats.map(function(c){return '<button class="tab'+(menuCat===String(c.id)?' active':'')+'" data-cat="'+c.id+'">'+eh(lf(c,'name'))+'</button>'}).join('');
  document.getElementById('m-tabs').innerHTML=th;
  var fi=menuCat==='all'?menuD.items:menuD.items.filter(function(i){return String(i.category_id)===menuCat});
  var g=document.getElementById('m-grid');
  if(!fi.length){g.innerHTML='<p class="tc tc-t" style="grid-column:1/-1">No items.</p>';return}
  g.innerHTML=fi.map(function(it,i){
    var img=it.image_url?'<div class="mi-img"><img src="'+it.image_url+'"></div>':'<div class="mi-img"><span style="font-size:2rem">🍽️</span></div>';
    return '<div class="mi fiu" style="animation-delay:'+(i*.05)+'s">'+img+'<div class="mi-body"><div class="mi-hdr"><h3 style="font-family:var(--fd);font-size:1.125rem;font-weight:700">'+eh(lf(it,'name'))+'</h3><span class="card-price">'+t('menu.price')+' '+Number(it.price).toFixed(2)+'</span></div><p class="tc" style="font-size:.875rem">'+eh(lf(it,'desc'))+'</p></div></div>'}).join('');
}
document.addEventListener('click',function(e){var b=e.target.closest('.tab[data-cat]');if(b){menuCat=b.getAttribute('data-cat');renderMenu()}});

/* ===== LOGIN ===== MODIFIED: supports register mode ===== */
var loginMode='login'; /* 'login' or 'register' */

function toggleLoginMode(){
  loginMode=loginMode==='login'?'register':'login';
  document.getElementById('lg-err').classList.add('hd');
  renderLogin();
}

function renderLogin(){
  var isReg=loginMode==='register';
  document.getElementById('lg-title').textContent=isReg?t('register.title'):t('login.title');
  document.getElementById('ll-email').textContent=t('login.email');
  document.getElementById('ll-pass').textContent=t('login.password');
  document.getElementById('lg-btn').textContent=isReg?t('register.submit'):t('login.submit');
  document.getElementById('lg-toggle').textContent=isReg?t('register.hasAccount')+' '+t('register.loginInstead'):t('register.noAccount')+' '+t('register.regInstead');

  /* show/hide register-only fields */
  var nw=document.getElementById('lg-name-wrap');
  var cw=document.getElementById('lg-cpass-wrap');
  var ni=document.getElementById('l-name');
  var ci=document.getElementById('l-cpass');
  if(isReg){
    nw.classList.remove('hd');cw.classList.remove('hd');
    ni.required=true;ci.required=true;
    document.getElementById('ll-name').textContent=t('register.name');
    document.getElementById('ll-cpass').textContent=t('register.confirmPass');
  }else{
    nw.classList.add('hd');cw.classList.add('hd');
    ni.required=false;ci.required=false;ni.value='';ci.value='';
  }
}

document.getElementById('lg-form').addEventListener('submit',async function(e){
  e.preventDefault();
  var btn=document.getElementById('lg-btn'),err=document.getElementById('lg-err');
  btn.disabled=true;btn.textContent='...';err.classList.add('hd');

  if(loginMode==='register'){
    /* ===== REGISTRATION FLOW ===== */
    try{
      var pw=gv('l-pass'),cpw=gv('l-cpass');
      if(pw!==cpw){throw new Error(t('register.passMismatch'))}
      await signUp(gv('l-name'),gv('l-email'),pw);
      toast(t('register.success'));
      /* switch to login mode after successful registration */
      loginMode='login';
      document.getElementById('l-name').value='';
      document.getElementById('l-cpass').value='';
      renderLogin();
    }catch(ex){
      err.textContent=ex.message||'Registration failed';err.classList.remove('hd');
    }finally{
      btn.disabled=false;btn.textContent=t('register.submit');
    }
  }else{
    /* ===== LOGIN FLOW (unchanged logic) ===== */
    try{
      var r=await signIn(gv('l-email'),gv('l-pass'));
      curUser=r.profile;
      location.hash=r.profile&&r.profile.role==='admin'?'#/admin':'#/';
    }catch(ex){
      err.textContent=t('login.error');err.classList.remove('hd');
    }finally{
      btn.disabled=false;btn.textContent=t('login.submit');
    }
  }
});

/* ===== NEW: PROFILE PAGE ===== */
function renderProfilePage(){
  if(!curUser){return}
  document.getElementById('pf-title').textContent=t('profile.title');
  document.getElementById('pf-l-photo').textContent=t('profile.avatar');
  document.getElementById('pf-l-name').textContent=t('profile.name');
  document.getElementById('pf-l-email').textContent=t('profile.email');
  document.getElementById('pf-btn').textContent=t('profile.save');
  document.getElementById('pf-name').value=curUser.name||'';
  document.getElementById('pf-email').value=curUser.email||'';

  /* display current avatar */
  var wrap=document.getElementById('pf-avatar-wrap');
  var imgEl=document.getElementById('pf-avatar-img');
  if(curUser.avatar_url){
    wrap.innerHTML='<img src="'+curUser.avatar_url+'" class="avatar-lg" alt="">';
  }else{
    wrap.innerHTML='<span id="pf-avatar-img" style="font-size:2.5rem">👤</span>';
  }
}

async function saveProfile(){
  if(!curUser)return;
  var btn=document.getElementById('pf-btn'),err=document.getElementById('pf-err');
  btn.disabled=true;btn.textContent='...';err.classList.add('hd');

  try{
    /* upload avatar if a file is selected */
    var fileInput=document.getElementById('pf-file');
    var avatarUrl=curUser.avatar_url||'';
    if(fileInput.files&&fileInput.files[0]){
      avatarUrl=await uploadImg(fileInput.files[0]);
    }

    var newName=gv('pf-name')||curUser.name;
    var updateData={name:newName};
    if(avatarUrl)updateData.avatar_url=avatarUrl;

    var r=await sb.from('profiles').update(updateData).eq('id',curUser.id);
    if(r.error)throw r.error;

    /* refresh local user data */
    curUser.name=newName;
    if(avatarUrl)curUser.avatar_url=avatarUrl;

    toast(t('profile.saved'));
    renderNav();
    renderProfilePage();
  }catch(ex){
    err.textContent=ex.message||'Error';err.classList.remove('hd');
  }finally{
    btn.disabled=false;btn.textContent=t('profile.save');
  }
}

async function saveCat(e,id){e.preventDefault();var d={name_zh:gv('mcz'),name_en:gv('mce'),name_ms:gv('mcs'),sort_order:parseInt(gv('mcsort'))||0};var r=id?await sb.from('categories').update(d).eq('id',id):await sb.from('categories').insert(d);if(r.error){toast(r.error.message,false);return}closeModal();await loadAdmin();renderAMenu();toast('Saved!')}
async function delCat(id){if(!confirm('Delete?'))return;var r=await sb.from('categories').delete().eq('id',id);if(r.error){toast(r.error.message,false);return}await loadAdmin();renderAMenu();toast('Deleted!')}

function openItemM(id){var it=id?A.items.find(function(x){return x.id===id}):null;document.getElementById('mod-title').textContent=it?t('admin.edit'):t('admin.addIt');var co='<option value="">— '+t('admin.category')+' —</option>'+A.cats.map(function(c){var s=it&&it.category_id===c.id?' selected':'';return '<option value="'+c.id+'"'+s+'>'+eh(lf(c,'name'))+'</option>'}).join('');document.getElementById('mod-body').innerHTML='<form onsubmit="saveItem(event,'+(id||'null')+')"><div class="fgr">'+mkIn('miz','名称 (中文)',it?it.name_zh:'')+mkIn('mie','Name (EN)',it?it.name_en:'')+'</div>'+mkIn('mis','Nama (BM)',it?it.name_ms:'')+'<div class="fgr"><div class="fg"><label class="fl-l">'+t('admin.desc')+' (中文)</label><textarea id="midz" class="ft" rows="2">'+eh(it?it.description_zh||'':'')+'</textarea></div><div class="fg"><label class="fl-l">'+t('admin.desc')+' (EN)</label><textarea id="mide" class="ft" rows="2">'+eh(it?it.description_en||'':'')+'</textarea></div></div><div class="fg"><label class="fl-l">'+t('admin.desc')+' (BM)</label><textarea id="mids" class="ft" rows="2">'+eh(it?it.description_ms||'':'')+'</textarea></div><div class="fgr"><div class="fg"><label class="fl-l">'+t('admin.price')+' (RM)</label><input type="number" id="mip" class="fi" step="0.01" min="0" value="'+(it?it.price:'0')+'" required></div><div class="fg"><label class="fl-l">'+t('admin.category')+'</label><select id="mic" class="fi fsel">'+co+'</select></div></div><div class="fgr"><div class="fg"><label class="fl-l">'+t('admin.sOrder')+'</label><input type="number" id="misort" class="fi" value="'+(it?it.sort_order:'0')+'"></div><div class="fg"><label class="fl-l">'+t('admin.available')+'</label><select id="miav" class="fi fsel"><option value="true"'+(!it||it.is_available?' selected':'')+'>'+t('admin.yes')+'</option><option value="false"'+(it&&!it.is_available?' selected':'')+'>'+t('admin.no')+'</option></select></div></div><div class="fg"><label class="fl-l">'+t('admin.uploadImg')+'</label><input type="file" id="mif" accept="image/*" class="fi" style="padding:.5rem">'+(it&&it.image_url?'<img src="'+it.image_url+'" class="img-prev">':'')+'<input type="hidden" id="miu" value="'+eh(it?it.image_url||'':'')+'"></div><button class="btn btn-p btn-fw mt2">'+t('admin.save')+'</button></form>';openModal()}
async function saveItem(e,id){e.preventDefault();var f=document.getElementById('mif').files[0];if(f){try{var u=await uploadImg(f);document.getElementById('miu').value=u}catch(err){toast(err.message,false);return}}var d={name_zh:gv('miz'),name_en:gv('mie'),name_ms:gv('mis'),description_zh:document.getElementById('midz').value,description_en:document.getElementById('mide').value,description_ms:document.getElementById('mids').value,price:parseFloat(gv('mip'))||0,category_id:gv('mic')?parseInt(gv('mic')):null,image_url:document.getElementById('miu').value,is_available:gv('miav')==='true',sort_order:parseInt(gv('misort'))||0,updated_at:new Date().toISOString()};var r=id?await sb.from('menu_items').update(d).eq('id',id):await sb.from('menu_items').insert(d);if(r.error){toast(r.error.message,false);return}closeModal();await loadAdmin();renderAMenu();toast('Saved!')}
async function delItem(id){if(!confirm('Delete?'))return;var r=await sb.from('menu_items').delete().eq('id',id);if(r.error){toast(r.error.message,false);return}await loadAdmin();renderAMenu();toast('Deleted!')}

function renderARes(){
  document.getElementById('as-res').innerHTML='<h2 style="margin-bottom:1.5rem">'+t('admin.res')+'</h2><div class="ap"><div class="tw"><table class="dt"><thead><tr><th>#</th><th>'+t('admin.gName')+'</th><th>'+t('admin.gEmail')+'</th><th>'+t('admin.gPhone')+'</th><th>'+t('admin.date')+'</th><th>'+t('admin.time')+'</th><th>'+t('admin.sz')+'</th><th>'+t('admin.status')+'</th><th>'+t('admin.notes')+'</th><th>'+t('admin.actions')+'</th></tr></thead><tbody id="res-tb"></tbody></table></div></div>';
  renderResTb();
}
function renderResTb(){document.getElementById('res-tb').innerHTML=A.res.map(function(r){var b='<span class="badge b-'+r.status+'">'+(t('admin.'+r.status)||r.status)+'</span>';var a='';if(r.status==='pending'){a='<button class="btn btn-sm btn-s" onclick="updRes('+r.id+',\'confirmed\')">'+t('admin.confirm')+'</button> <button class="btn btn-sm btn-d" onclick="updRes('+r.id+',\'cancelled\')">'+t('admin.cancel')+'</button>'}else if(r.status==='confirmed'){a='<button class="btn btn-sm btn-d" onclick="updRes('+r.id+',\'cancelled\')">'+t('admin.cancel')+'</button>'}a+=' <button class="btn btn-sm btn-o td" onclick="delRes('+r.id+')">'+t('admin.delete')+'</button>';return '<tr><td>'+r.id+'</td><td>'+eh(r.guest_name)+'</td><td>'+eh(r.guest_email)+'</td><td>'+eh(r.guest_phone)+'</td><td>'+r.reservation_date+'</td><td>'+r.reservation_time+'</td><td>'+r.party_size+'</td><td>'+b+'</td><td class="tc" style="max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+eh(r.notes||'—')+'</td><td style="white-space:nowrap">'+a+'</td></tr>'}).join('')}
async function updRes(id,s){var r=await sb.from('reservations').update({status:s}).eq('id',id);if(r.error){toast(r.error.message,false);return}await loadAdmin();renderResTb();toast('Updated!')}
async function delRes(id){if(!confirm('Delete?'))return;var r=await sb.from('reservations').delete().eq('id',id);if(r.error){toast(r.error.message,false);return}await loadAdmin();renderResTb();toast('Deleted!')}

function openModal(){document.getElementById('modal').classList.add('open')}
function closeModal(){document.getElementById('modal').classList.remove('open')}

/* ===== RENDER ALL ===== MODIFIED: added renderProfilePage ===== */
function renderAll(){
  renderNav();renderFooter();
  renderHome();renderMenu();renderResLabels();renderAbout();renderContact();renderLogin();
  if(curUser)renderProfilePage();
}

/* ===== INIT ===== */
document.addEventListener('DOMContentLoaded',async function(){
  try{curUser=await getCur()}catch(e){}
  await Promise.all([loadHome(),loadMenu(),loadAbout(),loadContact()]);
  renderAll();
  navigate();
});
</script>
