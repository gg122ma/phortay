<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ä¸‰è„šçŒ« 3 Leg Cat Cafe</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>ðŸ±</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Source+Sans+3:wght@300;400;600;700&family=DM+Mono:wght@400&display=swap" rel="stylesheet">

<link rel="stylesheet" href="./site.css">
</head>
<body>

<!-- NAVBAR -->
<div id="navbar"></div>

<!-- PAGES -->

<!-- HOME -->
<div class="page" id="pg-home">
  <section class="hero" id="hero-sec">
    <div class="hero-ov"></div>
    <div class="hero-ct fiu">
      <h1 class="hero-title" id="h-title">3 Leg Cat</h1>
      <p class="hero-sub" id="h-sub">Loading...</p>
      <div class="hero-btns">
        <a class="btn btn-p btn-lg" id="h-book" href="#/reservation"></a>
        <a class="btn btn-o btn-lg" id="h-menu" href="#/menu"></a>
      </div>
    </div>
  </section>
  <section class="sec" id="feat-sec">
    <div class="ctn">
      <div class="sh"><h2 id="feat-title"></h2><div class="sd"></div></div>
      <div class="g3" id="feat-grid"></div>
      <div class="tc-t mt4"><a href="#/menu" class="btn btn-o" id="feat-more"></a></div>
    </div>
  </section>
</div>

<!-- MENU -->
<div class="page" id="pg-menu">
  <section class="sec">
    <div class="ctn">
      <div class="sh"><h1 id="m-title"></h1><div class="sd"></div></div>
      <div class="tabs" id="m-tabs"></div>
      <div class="g2" id="m-grid"></div>
    </div>
  </section>
</div>

<!-- RESERVATION -->
<div class="page" id="pg-reservation">
  <section class="sec" style="background:var(--bg-card)">
    <div class="ctn">
      <div class="fcard" id="res-form-wrap">
        <div class="tc-t mb3"><h1 id="r-title"></h1><div class="sd mt2"></div></div>
        <form id="r-form">
          <div class="fgr">
            <div class="fg"><label class="fl-l" id="rl-name"></label><input type="text" id="r-name" class="fi" required></div>
            <div class="fg"><label class="fl-l" id="rl-email"></label><input type="email" id="r-email" class="fi" required></div>
          </div>
          <div class="fgr">
            <div class="fg"><label class="fl-l" id="rl-phone"></label><input type="tel" id="r-phone" class="fi" required></div>
            <div class="fg"><label class="fl-l" id="rl-size"></label><input type="number" id="r-size" class="fi" min="1" max="20" value="2" required></div>
          </div>
          <div class="fgr">
            <div class="fg"><label class="fl-l" id="rl-date"></label><input type="date" id="r-date" class="fi" required></div>
            <div class="fg"><label class="fl-l" id="rl-time"></label><input type="time" id="r-time" class="fi" value="19:00" required></div>
          </div>
          <div class="fg"><label class="fl-l" id="rl-notes"></label><textarea id="r-notes" class="ft" rows="3"></textarea></div>
          <button type="submit" class="btn btn-p btn-fw btn-lg" id="r-btn"></button>
        </form>
      </div>
      <div class="fcard hd" id="res-ok">
        <div class="fok">
          <div class="fok-ic">âœ“</div>
          <h2 id="ok-title"></h2>
          <p class="tc mt1 mb3" id="ok-desc"></p>
          <button class="btn btn-o" id="ok-another" onclick="resetRes()"></button>
        </div>
      </div>
    </div>
  </section>
</div>

<!-- ABOUT -->
<div class="page" id="pg-about">
  <section class="sec">
    <div class="ctn" style="max-width:720px">
      <div class="sh"><h1 id="ab-title"></h1><div class="sd"></div></div>
      <p id="ab-story" style="font-size:1.125rem;line-height:1.8;color:var(--text-muted)"></p>
    </div>
  </section>
</div>

<!-- CONTACT -->
<div class="page" id="pg-contact">
  <section class="sec">
    <div class="ctn" style="max-width:720px">
      <div class="sh"><h1 id="co-title"></h1><div class="sd"></div></div>
      <div style="display:flex;flex-direction:column;gap:2.5rem">
        <div><h3 id="cl-addr" style="color:var(--primary);margin-bottom:.5rem"></h3><p id="c-addr" class="tc"></p></div>
        <div><h3 id="cl-phone" style="color:var(--primary);margin-bottom:.5rem"></h3><p id="c-phone" class="tc"></p></div>
        <div><h3 id="cl-email" style="color:var(--primary);margin-bottom:.5rem"></h3><p id="c-email" class="tc"></p></div>
        <div><h3 id="cl-hours" style="color:var(--primary);margin-bottom:.5rem"></h3><p id="c-hours" class="tc"></p></div>
      </div>
    </div>
  </section>
</div>

<!-- LOGIN ===== MODIFIED: supports register mode ===== -->
<div class="page" id="pg-login">
  <section class="sec" style="display:flex;align-items:center;justify-content:center;min-height:70vh">
    <div class="fcard" style="max-width:28rem;width:100%">
      <div class="tc-t mb3"><h1 id="lg-title"></h1><div class="sd mt2"></div></div>
      <form id="lg-form">
        <div class="fg hd" id="lg-name-wrap"><label class="fl-l" id="ll-name"></label><input type="text" id="l-name" class="fi"></div>
        <div class="fg"><label class="fl-l" id="ll-email"></label><input type="email" id="l-email" class="fi" required placeholder="admin@3legcat.com"></div>
        <div class="fg"><label class="fl-l" id="ll-pass"></label><input type="password" id="l-pass" class="fi" required></div>
        <div class="fg hd" id="lg-cpass-wrap"><label class="fl-l" id="ll-cpass"></label><input type="password" id="l-cpass" class="fi"></div>
        <p class="ferr hd" id="lg-err"></p>
        <button type="submit" class="btn btn-p btn-fw btn-lg mt2" id="lg-btn"></button>
        <p class="tc mt2" style="font-size:.875rem"><a href="#" id="lg-toggle" onclick="toggleLoginMode();return false" style="color:var(--primary);text-decoration:underline"></a></p>
      </form>
    </div>
  </section>
</div>

<!-- ===== NEW: PROFILE PAGE ===== -->
<div class="page" id="pg-profile">
  <section class="sec" style="background:var(--bg-card)">
    <div class="ctn">
      <div class="fcard" style="max-width:32rem">
        <div class="tc-t mb3"><h1 id="pf-title"></h1><div class="sd mt2"></div></div>
        <div class="tc-t mb3">
          <div id="pf-avatar-wrap" style="width:6rem;height:6rem;border-radius:50%;overflow:hidden;margin:0 auto;background:var(--bg-card);display:flex;align-items:center;justify-content:center;border:3px solid var(--border)">
            <span id="pf-avatar-img" style="font-size:2.5rem">ðŸ‘¤</span>
          </div>
        </div>
        <div class="fg"><label class="fl-l" id="pf-l-photo"></label><input type="file" id="pf-file" accept="image/*" class="fi" style="padding:.5rem"></div>
        <div class="fg"><label class="fl-l" id="pf-l-name"></label><input type="text" id="pf-name" class="fi"></div>
        <div class="fg"><label class="fl-l" id="pf-l-email"></label><input type="email" id="pf-email" class="fi" disabled style="opacity:.6;cursor:not-allowed"></div>
        <p class="ferr hd" id="pf-err"></p>
        <button class="btn btn-p btn-fw btn-lg mt2" id="pf-btn" onclick="saveProfile()"></button>
      </div>
    </div>
  </section>
</div>

<!-- ADMIN -->
<div class="page" id="pg-admin">
  <div class="a-layout" id="a-app" style="display:none">
    <aside class="a-side" id="a-side"></aside>
    <div class="a-main">
      <div class="a-sec" id="as-dash"></div>
      <div class="a-sec" id="as-home"></div>
      <div class="a-sec" id="as-menu"></div>
      <div class="a-sec" id="as-res"></div>
    </div>
  </div>
  <div id="a-denied" class="hd tc-t" style="padding:6rem 1rem"><p class="tc">Redirecting...</p></div>
</div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-ov" onclick="closeModal()"></div>
  <div class="modal-ct">
    <div class="modal-hd"><h2 id="mod-title"></h2><button class="modal-x" onclick="closeModal()">&times;</button></div>
    <div id="mod-body"></div>
  </div>
</div>

<!-- FOOTER & TOAST -->
<div id="footer"></div>
<div id="toast-box"></div>

<!-- SCRIPTS -->
<script src="./app.js"></script>
</body>
</html>
